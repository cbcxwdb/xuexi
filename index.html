<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="card">
    <!-- 占位头像：用 emoji 代替图片，方便学习 -->
    <div class="avatar" title="我的头像">🧑‍💻</div>

    <!-- 你的名字 -->
    <h1 class="name">lhh</h1>

    <!-- 一句话简介 -->
    <p class="intro">计算机科学与技术的专升本在读学生
      正在从新学习前端开发，并与ai结合使用，
      路线是HTML/CSS/JS->React->node.js
      目标是，在明年实训前能成为一名能独立交付ai工具的前端实习生。
    </p>
    <div class="skills">
      <h2>我的技能树</h2>
      <ul>
      </ul>
    </div>
    <!-- 按钮 -->
    <button class="btn">点我看看</button>
  </div>
  <script>
    (function () {
      // 适合暗色主题页面的精选配色
      var colors = [
        '#1a1a2e', // 深海蓝
        '#16213e', // 午夜蓝
        '#0f3460', // 宝石蓝
        '#2d3436', // 深炭灰
        '#1e272e', // 暗石板色
        '#2c3e50', // 灰蓝色
        '#1b1b2f', // 暗紫蓝
        '#000000'  // 纯黑
      ];
      var index = 0;

      document.querySelector('.btn').addEventListener('click', function () {
        alert('欢迎来到我的个人主页！');
        document.body.style.background = colors[index];
        index = (index + 1) % colors.length;
      });
    })();

    const mySkills = ["HTML", "CSS", "JavaScript", "AI 工具应用", "React"];
    const ulElement = document.querySelector('.skills ul');
    mySkills.forEach(skill => {
      const li = document.createElement('li');
      li.textContent = skill;
      ulElement.appendChild(li);
    });
  </script>
</body>

</html>
